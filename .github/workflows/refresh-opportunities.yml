name: Refresh student opportunity catalogue
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
permissions: {}
concurrency:
  group: catalogue-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Run protected refresh
        env:
          SITE_URL: ${{ secrets.HIRE_SITE_URL }}
          CRON_SECRET: ${{ secrets.HIRE_CRON_SECRET }}
        run: |
          test -n "$SITE_URL" && test -n "$CRON_SECRET"
          curl --fail --silent --show-error --max-time 300 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$SITE_URL/api/cron/update-opportunities"
