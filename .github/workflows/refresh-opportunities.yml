name: Refresh student opportunity catalogue
on:
  push:
    branches: [main]
    paths:
      - "data/sources.json"
      - "data/reviewed-programs.json"
      - "data/richmond-jobs.json"
      - "lib/opportunities/**"
      - "app/api/cron/**"
      - "app/api/catalogue-status/**"
      - "scripts/run-sync.mjs"
      - ".github/workflows/refresh-opportunities.yml"
  schedule:
    # Check hourly; each source is collected at most once per six-hour interval.
    # This also retries failed imports and avoids a delayed run skipping 12 hours.
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Recheck sources now, bypassing collection intervals
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: catalogue-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Run protected refresh
        env:
          NEXT_PUBLIC_SITE_URL: ${{ vars.HIRE_SITE_URL || 'https://hire-edu.vercel.app' }}
          CRON_SECRET: ${{ secrets.HIRE_CRON_SECRET }}
          EXPECTED_DEPLOYMENT_SHA: ${{ github.event_name == 'push' && github.sha || '' }}
          FORCE_REFRESH: ${{ github.event_name == 'workflow_dispatch' && inputs.force && 'true' || 'false' }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::Set HIRE_CRON_SECRET in repository secrets to match the Vercel project's CRON_SECRET. No refresh was attempted."
            exit 1
          fi
          node scripts/run-sync.mjs
